<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Illustration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eaf8fc;
      color: #52636a;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    header {
      background: #fffdf5;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 4px solid #fff0a8;
    }

    header h1 {
      margin: 0;
      color: #63b9cf;
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #8a9da3;
      font-size: 14px;
    }

    nav {
      margin-top: 20px;
    }

    nav a {
      display: inline-block;
      margin: 5px 6px;
      padding: 8px 16px;
      background: #ffffff;
      color: #63aebf;
      text-decoration: none;
      border-radius: 30px;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(80, 170, 190, 0.12);
    }

    nav a:hover {
      background: #fff3a8;
      color: #65736f;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .welcome {
      background: #ffffff;
      border-radius: 30px;
      padding: 50px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(70, 160, 180, 0.12);
      border: 3px solid #d8f4fa;
    }

    .welcome h2 {
      margin-top: 0;
      color: #62b6cc;
      font-size: 25px;
    }

    .welcome p {
      line-height: 2;
      color: #718187;
    }

    .decoration {
      font-size: 30px;
      letter-spacing: 10px;
      margin-bottom: 15px;
    }

    .gallery-title {
      margin-top: 60px;
      text-align: center;
      color: #e4bd43;
      font-size: 24px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 25px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      background: #fffdf5;
      border-radius: 22px;
      border: 3px solid #fff0a8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b5a96b;
      font-size: 14px;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 19px;
    }

    footer {
      margin-top: 50px;
      padding: 30px 20px;
      text-align: center;
      background: #fffdf5;
      color: #91a0a4;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      main {
        padding: 30px 15px;
      }

      .welcome {
        padding: 35px 20px;
      }
    }

    /* 拡大表示 */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(40, 60, 65, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .image-modal img {
  max-width: 95%;
  max-height: 90%;
  object-fit: contain;
  border-radius: 15px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
}
    
.image-counter {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.85);
  color: #65736f;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  letter-spacing: 1px;
}
  </style>
</head>

<body>

  <header>
    <h1>My Illustration</h1>
    <p>Illustration &amp; Art</p>

    <nav>
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
      <a href="#blog">Blog</a>
    </nav>
  </header>

  <main>

    <section class="welcome" id="home">
      <div class="decoration">☁️ ✦ ☁️</div>

      <h2>Welcome to my world</h2>

      <p>
        ここにあなたのイラストや作品を<br>
        少しずつ紹介していきます。
      </p>
    </section>

    <h2 class="gallery-title" id="gallery">
      Gallery
    </h2>

    <section class="gallery">

      <div class="gallery-item">
        <img src="20260817.png" alt="イラスト作品1" onclick="openImage(0)">
      </div>

      <div class="gallery-item">
        <img src="イラスト02.png" alt="イラスト作品2" onclick="openImage(1)">
      </div>

      <div class="gallery-item">
        <img src="イラスト03.png" alt="イラスト作品3" onclick="openImage(2)">
      </div>

      <div class="gallery-item">
        <img src="イラスト04.png" alt="イラスト作品4" onclick="openImage(3)">
      </div>

      <div class="gallery-item">
        <img src="イラスト05.png" alt="イラスト作品5" onclick="openImage(4)">
      </div>

      <div class="gallery-item">
        <img src="イラスト06.png" alt="イラスト作品6" onclick="openImage(5)">
      </div>

    </section>

  </main>

  <footer>
    © My Illustration
  </footer>

  <div class="image-modal" id="imageModal">
  <img id="modalImage" src="" alt="拡大表示">
  <div class="image-counter" id="imageCounter">1 / 6</div>
</div>

  <script>

  // ギャラリーの画像一覧
  const images = [
    "20260817.png",
    "イラスト02.png",
    "イラスト03.png",
    "イラスト04.png",
    "イラスト05.png",
    "イラスト06.png"
  ];

  // 現在の画像番号
  let currentIndex = 0;

  // スワイプ開始位置
  let startX = 0;
  let startY = 0;

 const modal = document.getElementById("imageModal");
const modalImage = document.getElementById("modalImage");
const imageCounter = document.getElementById("imageCounter");


  // 画像を開く
  function openImage(index) {

    currentIndex = index;

    modalImage.src = images[currentIndex];
imageCounter.textContent = (currentIndex + 1) + " / " + images.length;

modal.style.display = "flex";
  }


  // 画像を閉じる
  function closeImage() {

    modal.style.display = "none";
  }


  // 背景をタップしたら閉じる
  modal.addEventListener("click", function(event) {

    if (event.target === modal) {
      closeImage();
    }

  });


  // スワイプ開始
  modalImage.addEventListener("touchstart", function(event) {

    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;

  }, { passive: true });


  // スワイプ終了
  modalImage.addEventListener("touchend", function(event) {

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const diffX = endX - startX;
    const diffY = endY - startY;


    // 横方向に50px以上動いたときだけスワイプ
    if (
      Math.abs(diffX) > 50 &&
      Math.abs(diffX) > Math.abs(diffY)
    ) {


      // 左スワイプ → 次の作品
      if (diffX < 0) {

        currentIndex++;

        // 最後まで行ったら最初に戻る
        if (currentIndex >= images.length) {
          currentIndex = 0;
        }

      }


      // 右スワイプ → 前の作品
      else {

        currentIndex--;

        // 最初から右にスワイプしたら最後へ
        if (currentIndex < 0) {
          currentIndex = images.length - 1;
        }

      }


      // 次の画像を表示
      modalImage.src = images[currentIndex];
imageCounter.textContent = (currentIndex + 1) + " / " + images.length;

    }

  }, { passive: true });


</script>

</body>
</html>
